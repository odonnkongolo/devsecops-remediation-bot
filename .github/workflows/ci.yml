name: DevSecOps Code Quality & Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Ruff — Python Linting & Format Check
  # ─────────────────────────────────────────────
  ruff:
    name: 🔍 Ruff — Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff linter
        run: ruff check src/

      - name: Run Ruff format check
        run: ruff format --check src/

  # ─────────────────────────────────────────────
  # JOB 2: Bandit — Python Security Analysis
  # ─────────────────────────────────────────────
  bandit:
    name: 🔐 Bandit — Security Scan
    runs-on: ubuntu-latest
    needs: ruff

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit security scan
        run: bandit -r src/ -ll -ii

  # ─────────────────────────────────────────────
  # JOB 3: Trivy — IaC & Filesystem Vulnerability Scan
  # ─────────────────────────────────────────────
  trivy:
    name: 🛡️ Trivy — IaC & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: bandit

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install Trivy
        run: |
          wget -q https://github.com/aquasecurity/trivy/releases/download/v0.71.0/trivy_0.71.0_Linux-64bit.tar.gz
          tar zxvf trivy_0.71.0_Linux-64bit.tar.gz
          sudo mv trivy /usr/local/bin/

      - name: Run Trivy — filesystem scan
        run: |
          trivy fs \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --ignore-unfixed \
            --format table \
            .

      - name: Run Trivy — Terraform IaC scan
        run: |
          trivy config \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --format table \
            infrastructure/

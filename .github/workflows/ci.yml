name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Ruff — Python Linting & Format Check
  # ─────────────────────────────────────────────
  ruff:
    name: 🔍 Ruff — Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff linter
        run: ruff check src/

      - name: Run Ruff format check
        run: ruff format --check src/

  # ─────────────────────────────────────────────
  # JOB 2: Bandit — Python Security Analysis
  # ─────────────────────────────────────────────
  bandit:
    name: 🔐 Bandit — Security Scan
    runs-on: ubuntu-latest
    needs: ruff

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit security scan
        run: bandit -r src/ -ll -ii

  # ─────────────────────────────────────────────
  # JOB 3: Trivy — IaC & Filesystem Vulnerability Scan
  # ─────────────────────────────────────────────
  trivy:
    name: 🛡️ Trivy — IaC & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: bandit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run Trivy — filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

      - name: Run Trivy — Terraform IaC scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "config"
          scan-ref: "infrastructure/"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

  # ─────────────────────────────────────────────
  # JOB 4: Deploy — Terraform Apply
  # ─────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy — Terraform Apply
    runs-on: ubuntu-latest
    needs: trivy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-west-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init
        working-directory: infrastructure/

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: infrastructure/

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: infrastructure/
